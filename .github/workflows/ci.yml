name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          # go.mod carries no `toolchain` line: its `go` directive is exactly the
          # Go that setup-go installs. Caching stays off: when a `toolchain` line
          # did exist, GOTOOLCHAIN downloaded it into the module cache and
          # setup-go's cache tar collided on those read-only files
          # (tar: .../cgo: File exists).
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
